name: Test and publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # 本包零运行时依赖、也没有 lockfile，开 npm 缓存会让 setup-node 直接报
          # "Dependencies lock file is not found" 并中断整个 job。

      - name: Run tests
        run: npm test

      # 本包是 "type": "module"，Node 22 的 `node -p "require(...)"` 会直接抛错退出 2。
      # npm pkg get 只读清单、不执行包内代码，两种模块体系下都稳。
      - name: Read package version
        id: package
        run: echo "version=$(npm pkg get version | tr -d '\"')" >> "$GITHUB_OUTPUT"

      - name: Publish if this version is not already on npm
        run: |
          PACKAGE_NAME=$(npm pkg get name | tr -d '"')
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping."
            exit 0
          fi
          npm publish --access public
