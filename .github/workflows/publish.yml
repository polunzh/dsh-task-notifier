name: Test and publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # 不传 registry-url：setup-node 会因此写一行 `_authToken=${NODE_AUTH_TOKEN}`，
      # 空 token 会让 npm 先走 token 认证再轮到 OIDC，最后回报误导性的 404。
      # 也不用 cache: npm —— 本包零依赖、没有 lockfile，缓存反而会让 job 直接失败。
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 可信发布要求 npm CLI >= 11.5.1；Node 22 自带的 10.x 不认识 OIDC。
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 --no-fund --no-audit && npm --version

      - name: Run tests
        run: npm test

      # 本包是 "type": "module"，Node 22 的 `node -p "require(...)"` 会直接抛错退出 2。
      # npm pkg get 只读清单、不执行包内代码，两种模块体系下都稳。
      - name: Read package version
        id: package
        run: echo "version=$(npm pkg get version | tr -d '\"')" >> "$GITHUB_OUTPUT"

      # 认证靠 npmjs.com 上登记的 trusted publisher（仓库 + publish.yml），
      # 由 GitHub Actions 的 id-token 换取短时凭据，仓库里不放任何长期 token。
      - name: Publish if this version is not already on npm
        run: |
          PACKAGE_NAME=$(npm pkg get name | tr -d '"')
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          # 已发布的版本直接跳过
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping."
            exit 0
          fi
          # 新版本先进入 npm 的 staged 发布队列，等维护者在 npmjs.com 批准后
          # 才会出现在 registry 上；同一版本的重复推送会报 409，这属于正常情况。
          set +e
          PUBLISH_OUTPUT=$(npm publish --access public 2>&1)
          PUBLISH_STATUS=$?
          set -e
          printf '%s\n' "$PUBLISH_OUTPUT"
          if [ "$PUBLISH_STATUS" -ne 0 ]; then
            if printf '%s' "$PUBLISH_OUTPUT" | grep -q "Cannot publish over previously staged version"; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is already staged; approve it at https://www.npmjs.com/package/$PACKAGE_NAME."
              exit 0
            fi
            exit "$PUBLISH_STATUS"
          fi
          echo "$PACKAGE_NAME@$PACKAGE_VERSION is staged; approve it at https://www.npmjs.com/package/$PACKAGE_NAME to release."
