<!doctype html>
<html lang="zh-CN" data-dsh-style="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>任务面板 · dsh-task-notifier 预览</title>
    <!--
      独立预览页：不连 DSH 宿主、不连外网。

      加载顺序（缺一不可）：
        1. preview/vendor/react.production.min.js        React 18 UMD（本地）
        2. preview/vendor/react-dom.production.min.js    ReactDOM 18 UMD（本地）
        3. 最小 __ModuleLoader__ 桩                       捕获 lib/client.js 的 factory 输出
        4. ../lib/client.js                              与 DSH 中加载的是同一份 bundle
        5. 页内预览脚本                                   造假 ctx / fetch，挂载两个 slot

      查询参数：
        ?state=filled|empty|busy     filled：默认数据；empty：空数据；busy：12条压测数据
        ?theme=light|dark            切换 html[data-ds-dark-theme] 与 token 兜底
        ?filter=input|running|unread 挂载后点击对应 .dtn-chip 切换单列筛选
        ?archive=1                   挂载后点击 .dtn-archive__bar 展开历史
        ?locale=zh|en                fake ctx.locale 的界面语言（默认 zh）
        ?focus=tab                   聚焦当前筛选 chip（截图用）
        ?debug=1                     显示预览调试信息（顶部状态 chip + 底部署名）；
                                     默认隐藏，避免进入 README / marketplace 截图
    -->
    <style>
      /* =====================================================================
         DSH 主题变量（浅色 / 深色两套）。
         值取自本机 App 的 @deepseek-ai/dsh-client-ui-theme（2026-11-04 快照），
         和 dsh-token-stats/preview/index.html 保持一致。
         ===================================================================== */
      :root {
        color-scheme: light;
        --dsw-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
        --ds-font-family-code: "SF Mono", "JetBrains Mono", "Fira Code", Consolas,
          "Liberation Mono", Menlo, Courier, "PingFang SC", "Microsoft YaHei";
        --dsw-radius-xs: 4px;
        --dsw-radius-sm: 8px;
        --dsw-radius-md: 12px;
        --dsw-radius-lg: 16px;
        --dsw-radius-xl: 20px;
        --dsw-radius-panel: 28px;

        --dsw-alias-bg-base: #ffffff;
        --dsw-alias-bg-layer-1: #ffffff;
        --dsw-alias-bg-layer-2: #ffffff;
        --dsw-alias-bg-layer-3: #ffffff;
        --dsw-alias-bg-module-platform: #f5f6f7;
        --dsw-alias-bg-skeleton: #0000000a;
        --dsw-alias-label-primary: #0f1115;
        --dsw-alias-label-primary-inverted: #ffffff;
        --dsw-alias-label-secondary: #61666b;
        --dsw-alias-label-tertiary: #81858c;
        --dsw-alias-label-caption: #adb2b8;
        --dsw-alias-label-dimmed: #e1e5ee;
        --dsw-alias-label-inverted: #ffffff;
        --dsw-alias-border-l1: #0000000a;
        --dsw-alias-border-l2: #0000001a;
        --dsw-alias-border-l3: #0000001f;
        --dsw-alias-border-l4: #00000029;
        --dsw-alias-state-business-primary: #4176e6;
        --dsw-alias-state-business-secondary: #6f96ec;
        --dsw-alias-state-business-tertiary: #e4edfd;
        --dsw-alias-state-success-primary: #22c55e;
        --dsw-alias-state-success-secondary: #4ed17e;
        --dsw-alias-state-success-tertiary: #e6faed;
        --dsw-alias-state-error-primary: #ec1313;
        --dsw-alias-state-error-secondary: #f25a5a;
        --dsw-alias-state-warn-primary: #f59e0b;
        --dsw-alias-state-warn-label: #dd8629;
        --dsw-alias-state-warn-tertiary: #fef5e7;
        --dsw-alias-state-idle-primary: #d4d4d4;
        --dsw-alias-interactive-bg-hover: #2631480f;
        --dsw-alias-interactive-bg-active: #2631481a;
        --dsw-alias-interactive-bg-hover-danger: #ec13130d;
        --dsw-alias-interactive-bg-hover-solid: #f1f3f5;
        --dsw-alias-interactive-bg-hover-accent: #e4edfd;
        --dsw-alias-scrollbar-bg-l2: #e5e5e5;
        --dsw-specific-sidebar-fill: #f9fafb;
        --dsw-specific-sidebar-nav-item-active: #ebeef2;
        --dsw-specific-sidebar-nav-item-hover: #f1f3f5;
        --dsw-specific-input-major: #ffffff;
        --dsw-focus-ring-color: #4176e6;
        --dsw-elevation-panel: 0 0 0 0.5px #00000029, 0 3px 8px 0 #00000008, 0 0 16px 0 #00000005;
        --dsw-elevation-prominent: 0 0 0 0.5px #00000029, 0 3px 8px 0 #0000000a, 0 0 20px 0 #0000000d;
        --dsw-elevation-soft: 0 0 0 0.5px #00000029, 0 4px 16px 0 #00000008, 0 0 24px 0 #00000008;

        /* 真实宿主用自定义窗口框时的安全区；预览里为 0。 */
        --dsh-frame-top-clearance: 0px;
        --dsh-frame-leading-clearance: 0px;
      }
      html[data-ds-dark-theme] {
        color-scheme: dark;
        --dsw-alias-bg-base: #151517;
        --dsw-alias-bg-layer-1: #232324;
        --dsw-alias-bg-layer-2: #2c2c2e;
        --dsw-alias-bg-layer-3: #353638;
        --dsw-alias-bg-module-platform: #353638;
        --dsw-alias-bg-skeleton: #ffffff14;
        --dsw-alias-label-primary: #f9fafb;
        --dsw-alias-label-primary-inverted: #0f1115;
        --dsw-alias-label-secondary: #cfd3d6;
        --dsw-alias-label-tertiary: #adb2b8;
        --dsw-alias-label-caption: #81858c;
        --dsw-alias-label-dimmed: #43454a;
        --dsw-alias-label-inverted: #0f1115;
        --dsw-alias-border-l1: #ffffff0f;
        --dsw-alias-border-l2: #ffffff1f;
        --dsw-alias-border-l3: #ffffff29;
        --dsw-alias-border-l4: #ffffff33;
        --dsw-alias-state-business-primary: #7aaaff;
        --dsw-alias-state-business-secondary: #9dbcff;
        --dsw-alias-state-business-tertiary: #34415b;
        --dsw-alias-state-success-primary: #22c55e;
        --dsw-alias-state-success-secondary: #4ed17e;
        --dsw-alias-state-success-tertiary: #233c2c;
        --dsw-alias-state-error-primary: #f25a5a;
        --dsw-alias-state-error-secondary: #f25a5a;
        --dsw-alias-state-warn-primary: #f59e0b;
        --dsw-alias-state-warn-label: #dd8629;
        --dsw-alias-state-warn-tertiary: #27241f;
        --dsw-alias-state-idle-primary: #545557;
        --dsw-alias-interactive-bg-hover: #ffffff14;
        --dsw-alias-interactive-bg-active: #ffffff24;
        --dsw-alias-interactive-bg-hover-danger: #f25a5a26;
        --dsw-alias-interactive-bg-hover-solid: #353638;
        --dsw-alias-interactive-bg-hover-accent: #34415b;
        --dsw-alias-scrollbar-bg-l2: #545557;
        --dsw-specific-sidebar-fill: #1b1b1c;
        --dsw-specific-sidebar-nav-item-active: #43454a;
        --dsw-specific-sidebar-nav-item-hover: #2c2c2e;
        --dsw-specific-input-major: #2c2c2e;
        --dsw-focus-ring-color: #7aaaff;
      }

      /* ============================== 基础 ============================== */
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--dsw-alias-bg-base);
        color: var(--dsw-alias-label-primary);
        font-family: var(--dsw-font-family);
        font-size: 14px;
        line-height: 22px;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      * {
        box-sizing: border-box;
      }
      button {
        font: inherit;
        color: inherit;
      }
      #app {
        display: flex;
        width: 100%;
        height: 100%;
      }

      /* ========================= 仿 DSH 侧栏 ========================= */
      .sidebar {
        flex: 0 0 248px;
        width: 248px;
        display: flex;
        flex-direction: column;
        background: var(--dsw-specific-sidebar-fill);
        border-right: 0.5px solid var(--dsw-alias-border-l1);
      }
      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 52px;
        padding: 0 16px;
        flex: 0 0 auto;
      }
      .brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        display: grid;
        place-items: center;
        background: var(--dsw-alias-state-business-primary);
        color: var(--dsw-alias-label-primary-inverted);
      }
      .brand-mark svg {
        width: 13px;
        height: 13px;
      }
      .brand-name {
        font-size: 13px;
        font-weight: 600;
        color: var(--dsw-alias-label-primary);
        letter-spacing: 0.1px;
      }
      .sidebar-nav {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 6px 8px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .nav-section {
        padding: 10px 10px 4px;
        font-size: 11px;
        line-height: 14px;
        color: var(--dsw-alias-label-caption);
        letter-spacing: 0.4px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 9px;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: var(--dsw-radius-sm);
        background: transparent;
        color: var(--dsw-alias-label-secondary);
        text-align: left;
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }
      .nav-item:hover {
        background: var(--dsw-specific-sidebar-nav-item-hover);
        color: var(--dsw-alias-label-primary);
      }
      .nav-item.active {
        background: var(--dsw-specific-sidebar-nav-item-active);
        color: var(--dsw-alias-label-primary);
        font-weight: 500;
      }
      .nav-item > svg {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
      }
      .nav-item .nav-arrow {
        margin-left: auto;
        color: var(--dsw-alias-label-caption);
        width: 14px;
        height: 14px;
        flex: 0 0 auto;
      }
      .slot-icon {
        display: inline-flex;
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
        align-items: center;
        justify-content: center;
      }
      .slot-icon svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .sidebar-foot {
        flex: 0 0 auto;
        padding: 10px 16px 14px;
        border-top: 0.5px solid var(--dsw-alias-border-l1);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        line-height: 14px;
        color: var(--dsw-alias-label-caption);
      }
      .preview-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 2px 6px;
        border-radius: 999px;
        border: 0.5px solid var(--dsw-alias-border-l2);
        color: var(--dsw-alias-label-tertiary);
        background: var(--dsw-alias-bg-module-platform);
      }
      .preview-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--dsw-alias-state-warn-primary);
      }

      /* ========================== 主内容区 ========================== */
      .main {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--dsw-alias-bg-base);
      }
      .main-header {
        flex: 0 0 auto;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 18px;
        border-bottom: 0.5px solid var(--dsw-alias-border-l1);
      }
      .main-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--dsw-alias-label-primary);
      }
      .main-breadcrumb {
        font-size: 11px;
        color: var(--dsw-alias-label-caption);
        letter-spacing: 0.2px;
      }
      .main-hint {
        margin-left: auto;
        font-size: 10px;
        line-height: 14px;
        letter-spacing: 0.2px;
        color: var(--dsw-alias-label-caption);
        padding: 2px 8px;
        border-radius: 999px;
        border: 0.5px dashed var(--dsw-alias-border-l2);
        white-space: nowrap;
      }
      #main-slot {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--dsw-alias-bg-base);
      }
      #main-slot > * {
        min-height: 0;
        min-width: 0;
      }

      /* 预览调试信息默认隐藏（README / marketplace 截图不应出现）。
         开发时加 ?debug=1 打开。 */
      html:not([data-preview-debug="1"]) .main-hint,
      html:not([data-preview-debug="1"]) .sidebar-foot {
        display: none !important;
      }

      /* ======================= 加载失败兜底卡片 ======================= */
      #preview-fallback {
        position: fixed;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        background: color-mix(in srgb, var(--dsw-alias-bg-base) 86%, transparent);
        backdrop-filter: blur(6px);
        z-index: 50;
      }
      #preview-fallback[data-visible="true"] {
        display: grid;
      }
      .fallback-card {
        max-width: 460px;
        width: 100%;
        padding: 22px 24px;
        border-radius: var(--dsw-radius-lg);
        border: 0.5px solid var(--dsw-alias-border-l2);
        background: var(--dsw-alias-bg-layer-1);
        box-shadow: var(--dsw-elevation-panel);
      }
      .fallback-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 15px;
        font-weight: 600;
        color: var(--dsw-alias-label-primary);
        margin: 0 0 8px;
      }
      .fallback-title svg {
        width: 18px;
        height: 18px;
        color: var(--dsw-alias-state-warn-primary);
      }
      .fallback-text {
        margin: 0;
        font-size: 13px;
        line-height: 21px;
        color: var(--dsw-alias-label-secondary);
        word-break: break-word;
      }
      .fallback-code {
        margin: 12px 0 0;
        padding: 10px 12px;
        border-radius: var(--dsw-radius-sm);
        background: var(--dsw-alias-bg-module-platform);
        font-family: var(--ds-font-family-code);
        font-size: 11px;
        line-height: 17px;
        color: var(--dsw-alias-label-tertiary);
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* ============================ 窄屏 ============================ */
      @media (max-width: 820px) {
        .sidebar {
          flex: 0 0 60px;
          width: 60px;
        }
        .sidebar-brand,
        .nav-section,
        .sidebar-foot {
          display: none;
        }
        .sidebar-nav {
          padding: 10px 8px;
          gap: 6px;
        }
        .nav-item {
          height: 38px;
          justify-content: center;
          padding: 0;
        }
        .nav-item > span:not(.slot-icon),
        .nav-item .nav-arrow {
          display: none;
        }
        .main-header {
          height: 42px;
          padding: 0 14px;
        }
        .main-hint,
        .main-breadcrumb {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar" aria-label="DSH 侧栏（预览）">
        <div class="sidebar-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 17c2.4 0 3.6-10 6-10s3.6 10 6 10 3.6-6 4-6" />
            </svg>
          </span>
          <span class="brand-name">DeepSeek Harness</span>
        </div>
        <nav class="sidebar-nav">
          <div class="nav-section" data-shell="workspace">工作区</div>
          <button class="nav-item" type="button" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h4l2 2.5h5A2.5 2.5 0 0 1 20 10v6.5a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/></svg>
            <span data-shell="sessions">会话</span>
          </button>
          <button class="nav-item" type="button" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.3 6.3l2.8 2.8M14.9 14.9l2.8 2.8M17.7 6.3l-2.8 2.8M9.1 14.9l-2.8 2.8"/></svg>
            <span data-shell="plugins">插件</span>
          </button>
          <div class="nav-section" data-shell="pluginPanels">插件面板</div>
          <!-- sidebar.panellist slot：插件的 PanelIcon 由 React 挂载到这里 -->
          <button class="nav-item active" type="button" aria-current="page" id="nav-task-notifier">
            <span class="slot-icon" id="sidebar-slot"></span>
            <span id="nav-label" data-shell="panelTitle">任务面板</span>
            <svg class="nav-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </nav>
        <div class="sidebar-foot">
          <span class="preview-badge"><span class="preview-dot"></span><span data-shell="localPreview">本地预览</span></span>
          <span id="preview-state">filled · light</span>
        </div>
      </aside>
      <main class="main">
        <header class="main-header">
          <span class="main-title" id="main-title" data-shell="panelTitle">任务面板</span>
          <span class="main-breadcrumb">dsh-task-notifier</span>
          <span class="main-hint" id="main-hint">mock 数据 · 本地预览</span>
        </header>
        <!-- main slot：插件 TasksPage 由 React 挂载到这里 -->
        <div id="main-slot"></div>
      </main>
    </div>

    <div id="preview-fallback" role="alert">
      <div class="fallback-card">
        <h2 class="fallback-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9 2.7 17a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
          <span id="fallback-title">预览暂时不可用</span>
        </h2>
        <p class="fallback-text" id="fallback-text"></p>
        <pre class="fallback-code" id="fallback-code"></pre>
      </div>
    </div>

    <!-- 1) React / ReactDOM 18 UMD：本地 vendored，无 CDN、无网络。 -->
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>

    <!-- 2) DSH 模块加载器的最小桩：只捕获 factory 的返回值，不执行宿主逻辑。 -->
    <script>
      (function () {
        var harness = { packages: {}, errors: [] };
        window.__previewHarness = harness;
        window.__ModuleLoader__ = {
          load: function (options) {
            try {
              if (!options || typeof options.factory !== "function") {
                throw new Error("__ModuleLoader__.load 缺少 factory");
              }
              var pkg = options.factory(function require(name) {
                if (name === "react") return window.React;
                if (name === "react-dom") return window.ReactDOM;
                return {};
              });
              if (options.id) harness.packages[options.id] = pkg;
              return pkg;
            } catch (error) {
              harness.errors.push(error);
              window.__previewLoadError = error;
              console.error("[preview] client bundle factory 执行失败：", error);
              return null;
            }
          },
        };
      })();
    </script>

    <!-- 3) 真实客户端 bundle（与 DSH 里加载的是同一份文件，只读不改）。 -->
    <script src="../lib/client.js"></script>

    <!-- 4) 预览装配：假 ctx + mock fetch + 挂载两个 slot + ready 标志。 -->
    <script>
      (function () {
        "use strict";

        var params = new URLSearchParams(window.location.search);
        var rawState = params.get("state");
        var stateName = rawState === "empty" ? "empty" : rawState === "busy" ? "busy" : "filled";
        var theme = params.get("theme") === "dark" ? "dark" : "light";
        var rawFilter = params.get("filter");
        var filterParam = ["input", "running", "unread"].indexOf(rawFilter) >= 0 ? rawFilter : null;
        var archiveParam = params.get("archive") === "1";
        var focusTab = params.get("focus") === "tab";
        var debugChrome = params.get("debug") === "1";
        // 宿主在重载后会恢复上次打开的主视图会话；?active=<id> 复现这个起点。
        var activeSessionParam = params.get("active") || "";
        // fake ctx.locale 的 active 语言：默认中文，?locale=en 切英文。
        var localeTag = params.get("locale") === "en" ? "en-US" : "zh-CN";
        var shellLang = localeTag.toLowerCase().indexOf("zh") === 0 ? "zh" : "en";

        var info = {
          state: stateName,
          theme: theme,
          filter: filterParam,
          archive: archiveParam,
          react: window.React && window.React.version ? window.React.version : null,
          locale: localeTag,
          debug: debugChrome,
          notificationPermission: null,
        };
        window.__previewInfo = info;

        /* 预览外壳自己的文案（宿主会给侧栏 / 主区域标题做本地化，这里也跟随）。 */
        var SHELL_TEXT = {
          zh: {
            workspace: "工作区",
            sessions: "会话",
            plugins: "插件",

        var tasks = stateName === "empty" ? [] : stateName === "busy" ? busyTasks() : seedTasks();
        var settings = { sound: true };

        function clone(value) {
          return JSON.parse(JSON.stringify(value));
        }

        function snapshot() {
          return {
            tasks: clone(tasks),
            settings: clone(settings),
            rev: rev,
            now: Date.now(),
          };
        }

        function jsonResponse(data) {
          return {
            ok: true,
            status: 200,
            json: async function () {
              return clone(data);
            },
          };
        }

        /* 调试/校验钩子：页面上可以直接读到 mock 任务表（含 unread 标记）。 */
        window.__previewTasks = function () {
          return clone(tasks);
        };

        /* fetch 桩：拦截 /task-notifier/api/*，其余请求放行（预览页本身不发请求）。 */
        var realFetch = typeof window.fetch === "function" ? window.fetch.bind(window) : null;
        window.fetch = async function (input, init) {
          var url = typeof input === "string" ? input : (input && input.url) || "";
          if (url.indexOf("/task-notifier/api/") === -1) {
            if (realFetch) return realFetch(input, init);
            throw new Error("预览没有真实网络：" + url);
          }
          var path = url.split("?")[0];
          var method = String((init && init.method) || "GET").toUpperCase();
          await sleep(25);

          if (path.slice(-6) === "/state") {
            return jsonResponse(snapshot());
          }
          if (path.slice(-5) === "/wait") {
            // 长轮询：慢一点返回，避免 pollLoop 原地打转。
            await sleep(1200);
            return jsonResponse({ rev: rev });
          }
          if (path.slice(-10) === "/heartbeat") {
            return jsonResponse({ ok: true, rev: rev });
          }
          if (path.slice(-7) === "/notify") {
            return jsonResponse({ ok: true, delivered: 1 });
          }
          if (path.slice(-5) === "/test") {
            return jsonResponse({ ok: true, sent: true });
          }
          if (path.slice(-5) === "/read") {
            var body = {};
            try {
              body = JSON.parse((init && init.body) || "{}");
            } catch (error) {
              body = {};
            }
            if (body.all) {
              tasks = tasks.map(function (task) {
                return Object.assign({}, task, { unread: false });
              });
            } else if (Array.isArray(body.ids)) {
              tasks = tasks.map(function (task) {
                return body.ids.indexOf(task.id) >= 0 ? Object.assign({}, task, { unread: false }) : task;
              });
            }
            rev += 1;
            return jsonResponse(snapshot());
          }
          return { ok: false, status: 404, json: async function () { return { error: "not found: " + method + " " + path }; } };
        };

        /* ------------------------- 假 locale 服务 -------------------------
           插件 1.1 起通过 ctx.locale 注册中/英文案。宿主契约：
             register(ns, dicts) -> cleanup
             bind(ns) -> (key, vars) => string
             getSnapshot() -> { active }
             subscribe(listener) -> unsubscribe
           这里固定 active=zh-CN，保证截图是中文界面（与 marketplace 文案一致）。
           ---------------------------------------------------------------- */
        var localeState = { tag: localeTag, dicts: {}, listeners: new Set() };

        function interpolate(template, vars) {
          if (!vars) return template;
          return String(template).replace(/\{(\w+)\}/g, function (whole, key) {
            return Object.prototype.hasOwnProperty.call(vars, key) ? String(vars[key]) : whole;
          });
        }

        var localeApi = {
          register: function (namespace, dictionaries) {
            localeState.dicts[namespace] = dictionaries;
            return function () {
              delete localeState.dicts[namespace];
            };
          },
          bind: function (namespace) {
            return function translate(key, vars) {
              var dictionaries = localeState.dicts[namespace];
              if (!dictionaries) return key;
              var lang = localeState.tag.toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
              var table = dictionaries[lang] || dictionaries.zh || dictionaries.en;
              var text = table ? table[key] : undefined;
              if (typeof text !== "string") return key;
              return interpolate(text, vars);
            };
          },
          getSnapshot: function () {
            return {
              active: localeState.tag,
              available: ["zh-CN", "en-US"],
              namespaces: Object.keys(localeState.dicts),
            };
          },
          subscribe: function (listener) {
            localeState.listeners.add(listener);
            return function () {
              localeState.listeners.delete(listener);
            };
          },
        };

        /* --------------------------- 假 ctx --------------------------- */
        var entries = new Map();
        var cleanups = [];
        var openedSessions = [];

        /* 宿主 uiWorkspace.selection 的最小替身：snapshot store。
           真实宿主在切换主视图会话时发布 { sessionId }，插件据此同步已读。 */
        var selectionListeners = new Set();
        var selectionValue = activeSessionParam ? { sessionId: activeSessionParam } : {};
        var selection = {
          getSnapshot: function () {
            return selectionValue;
          },
          subscribe: function (listener) {
            selectionListeners.add(listener);
            return function () {
              selectionListeners.delete(listener);
            };
          },
        };
        function publishSelection(value) {
          selectionValue = value;
          selectionListeners.forEach(function (listener) {
            try {
              listener();
            } catch (error) {
              /* 观察者失败不影响发布 */
            }
          });
        }

        var ctx = {
          inject: ["slots", "layout", "uiWorkspace", "locale"],
          locale: localeApi,
          slots: {
            inject: function (name, factory) {
              return factory();
            },
            register: function (meta, render) {
              entries.set(meta.name, { meta: meta, render: render });
              return {
                dispose: function () {
                  entries.delete(meta.name);
                },
              };
            },
          },
          layout: {
            getInsets: function () {
              return { top: 0, leading: 0, trailing: 0, bottom: 0 };
            },
            getFrameInsets: function () {
              return { top: 0, leading: 0 };
            },
            frame: { topClearance: 0, leadingClearance: 0 },
          },
          uiWorkspace: {
            selection: selection,
            openSession: function (target) {
              var sessionId =
                typeof target === "string" ? target : (target && (target.sessionId || target.id)) || "";
              openedSessions.push(sessionId);
              publishSelection({ sessionId: sessionId });
              return Promise.resolve({ ok: true, sessionId: sessionId });
            },
          },
          effect: function (fn, label) {
            var cleanup = fn();
            if (typeof cleanup === "function") cleanups.push(cleanup);
            return cleanup;
          },
        };

        window.__previewCtx = ctx;
        window.addEventListener("beforeunload", function () {
          for (var i = 0; i < cleanups.length; i += 1) {
            try {
              cleanups[i]();
            } catch (error) {
              /* 页面卸载阶段忽略 */
            }
          }
        });

        /* --------------------------- 装配 --------------------------- */
        var harness = window.__previewHarness || { packages: {}, errors: [] };

        async function boot() {
          if (window.__previewLoadError) {
            fail("lib/client.js 的 factory 执行失败", window.__previewLoadError.stack || String(window.__previewLoadError));
            return;
          }
          if (!window.React || !window.ReactDOM) {
            fail("React / ReactDOM 没有加载", "检查 preview/vendor/ 下的 UMD 文件是否存在");
            return;
          }
          var pkg = harness.packages[Object.keys(harness.packages)[0]];
          if (!pkg || typeof pkg.apply !== "function") {
            fail("没有捕获到插件的模块输出", "确认 ../lib/client.js 在模块桩之后加载，且 factory 正常返回 apply()");
            return;
          }

          try {
            pkg.apply(ctx);
          } catch (error) {
            fail("apply(ctx) 执行失败", error && error.stack ? error.stack : String(error));
            return;
          }

          var mainContainer = document.getElementById("main-slot");
          var sidebarContainer = document.getElementById("sidebar-slot");

          function mount(name, container) {
            var entry = entries.get(name);
            if (!entry || !container) return false;
            ReactDOM.createRoot(container).render(React.createElement(entry.render));
            return true;
          }

          // 宿主会用 slots.register 的 meta.label 渲染侧栏项标题；这里对齐。
          var sidebarEntry = entries.get("sidebar.panellist");
          var panelLabel = sidebarEntry && sidebarEntry.meta && sidebarEntry.meta.label;
          if (panelLabel) {
            var navLabel = document.getElementById("nav-label");
            var mainTitle = document.getElementById("main-title");
            if (navLabel) navLabel.textContent = panelLabel;
            if (mainTitle) mainTitle.textContent = panelLabel;
          }

          var mainMounted = mount("main", mainContainer);
          var sidebarMounted = mount("sidebar.panellist", sidebarContainer);
          if (!mainMounted) {
            fail("main 槽位没有注册渲染器", "确认 ctx.slots.register 被调用且 meta.name 为 main");
            return;
          }
          if (!sidebarMounted) {
            fail("sidebar.panellist 槽位没有注册渲染器", "确认 ctx.slots.register 被调用且 meta.name 为 sidebar.panellist");
            return;
          }

          var rendered = await waitForRendered(9000);
          if (!rendered) {
            fail("面板在 9s 内没有渲染出内容", JSON.stringify(collectReport()));
            return;
          }

          if (filterParam) {
            var chip = document.querySelector('.dtn-chip[data-lane="' + filterParam + '"]');
            if (chip) chip.click();
            await sleep(140);
            await nextPaint();
          }
          if (archiveParam) {
            var archiveBar = document.querySelector(".dtn-archive__bar");
            if (archiveBar) archiveBar.click();
            await sleep(140);
            await nextPaint();
          }
          if (focusTab) {
            var targetChip =
              document.querySelector('.dtn-chip[aria-pressed="true"]') ||
              (filterParam ? document.querySelector('.dtn-chip[data-lane="' + filterParam + '"]') : null) ||
              document.querySelector(".dtn-chip");
            if (targetChip && typeof targetChip.focus === "function") targetChip.focus();
            await sleep(80);
          }

          info.notificationPermission =
            typeof Notification === "undefined" ? "unsupported" : Notification.permission;
          info.lanes = Array.from(document.querySelectorAll(".dtn-lane")).map(function (node) {
            var nameNode = node.querySelector(".dtn-lane__name");
            var countNode = node.querySelector(".dtn-lane__count");
            return {
              lane: (node.className.match(/dtn-lane--(\w+)/) || [])[1] || "",
              name: nameNode ? nameNode.textContent.trim() : "",
              count: countNode ? countNode.textContent.trim() : "",
              cards: node.querySelectorAll(".dtn-card").length,
            };
          });
          info.cards = Array.from(document.querySelectorAll(".dtn-card")).map(function (node) {
            var titleNode = node.querySelector(".dtn-card__title");
            var timeNode = node.querySelector(".dtn-card__time");
            var badgeNode = node.querySelector(".dtn-badge");
            return {
              title: titleNode ? titleNode.textContent.trim() : "",
              time: timeNode ? timeNode.textContent.trim() : "",
              badge: badgeNode ? badgeNode.textContent.trim() : "",
            };
          });
          info.chips = Array.from(document.querySelectorAll(".dtn-chip")).map(function (node) {
            return {
              lane: node.getAttribute("data-lane"),
              text: node.textContent.trim(),
              pressed: node.getAttribute("aria-pressed") === "true",
            };
          });
          var archiveBarNode = document.querySelector(".dtn-archive__bar");
          var archiveHistNodes = document.querySelectorAll(".dtn-hist");
          info.archive = archiveBarNode
            ? {
                text: archiveBarNode.textContent.trim(),
                expanded: archiveBarNode.getAttribute("aria-expanded") === "true",
                items: archiveHistNodes.length,
              }
            : null;
          info.openedSessions = openedSessions.slice();
          info.cleanupCount = cleanups.length;
          info.renderedScreenshot = true;

          afterPaint(function () {
            markReady("data");
          }, 90);
        }

        function nextPaint() {
          return new Promise(function (resolve) {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                resolve();
              });
            });
          });
        }

        async function waitForRendered(timeoutMs) {
          var expectedTitle = shellLang === "zh" ? "任务面板" : "Tasks";
          var expectedEmpty = shellLang === "zh" ? "现在没有任务" : "Nothing here yet";
          var deadline = Date.now() + timeoutMs;
          while (Date.now() < deadline) {
            var main = document.getElementById("main-slot");
            var text = main ? main.textContent || "" : "";
            if (text.indexOf(expectedTitle) >= 0) {
              if (stateName === "empty") {
                if (text.indexOf(expectedEmpty) >= 0) return true;
              } else {
                var cards = main.querySelectorAll(".dtn-card").length;
                if (cards >= 1) return true;
              }
            }
            if (window.__previewLoadError || window.__previewError) return false;
            await sleep(50);
          }
          return false;
        }

        function collectReport() {
          var main = document.getElementById("main-slot");
          return {
            ready: document.documentElement.dataset.ready || null,
            previewError: window.__previewError || null,
            mainExists: !!main,
            mainText: main ? main.textContent.trim().slice(0, 240) : "",
            lanes: document.querySelectorAll(".dtn-lane").length,
            cards: document.querySelectorAll(".dtn-card").length,
            chips: document.querySelectorAll(".dtn-chip").length,
            entries: Array.from(entries.keys()),
          };
        }

        window.__previewReport = collectReport;

        boot().catch(function (error) {
          fail("预览启动异常", error && error.stack ? error.stack : String(error));
        });
      })();
